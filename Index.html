<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HTML Launcher</title>
  
  <!-- Capacitor Native Runtime Bridge -->
  <script src="capacitor.js"></script>

  <style>
    *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #334155; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background-color: #090a10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      padding-top: max(env(safe-area-inset-top, 54px), 64px);
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 24px);
    }
    .squircle { border-radius: 22.5%; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-panel {
      background: rgba(22, 24, 32, 0.88);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .floating-glass {
      background: rgba(15, 23, 42, 0.85) !important;
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    #menu-pill {
      opacity: 0.6;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    #menu-pill:active, .is-dragging #menu-pill {
      opacity: 1 !important;
      transform: scale(1.04);
    }
    .app-press:active {
      transform: scale(0.92);
      opacity: 0.85;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    @keyframes jiggle {
      0% { transform: rotate(-1deg); }
      50% { transform: rotate(1.2deg); }
      100% { transform: rotate(-1deg); }
    }
    .jiggle { animation: jiggle 0.25s infinite ease-in-out; }

    .from-blue-600 { background-image: linear-gradient(135deg, #2563eb, #4338ca); }
    .from-purple-600 { background-image: linear-gradient(135deg, #9333ea, #4f46e5); }
    .from-pink-600 { background-image: linear-gradient(135deg, #db2777, #e11d48); }
    .from-amber-500 { background-image: linear-gradient(135deg, #f59e0b, #ea580c); }
    .from-emerald-600 { background-image: linear-gradient(135deg, #059669, #0f766e); }
    .from-cyan-500 { background-image: linear-gradient(135deg, #06b6d4, #2563eb); }
    .from-fuchsia-600 { background-image: linear-gradient(135deg, #c026d3, #db2777); }
    .from-red-600 { background-image: linear-gradient(135deg, #dc2626, #be123c); }

    .import-card-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
    }
    .import-card-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .import-card-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <!-- Ambient Glow -->
  <div style="position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.4;">
    <div style="position:absolute; top:-20%; left:-10%; width:80vw; height:80vw; border-radius:9999px; background:radial-gradient(circle, rgba(79,70,229,0.3) 0%, transparent 70%); filter:blur(40px);"></div>
    <div style="position:absolute; top:35%; right:-15%; width:70vw; height:70vw; border-radius:9999px; background:radial-gradient(circle, rgba(147,51,234,0.3) 0%, transparent 70%); filter:blur(40px);"></div>
  </div>

  <!-- Header -->
  <header style="position:relative; z-index:20; width:100%; padding:0 24px 10px 24px; display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h1 style="font-size:1.25rem; font-weight:700; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px;">
        <span>App Launcher</span>
        <span id="app-counter" style="font-size:0.75rem; padding:2px 10px; border-radius:9999px; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); font-weight:500;">0 Apps</span>
      </h1>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" id="btn-download-logs" style="width:36px; height:36px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Download Crash / Debug Log">
        <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
      </button>

      <button type="button" id="btn-open-backup" style="width:36px; height:36px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Backup & Diagnostics">
        <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 8 21 21 3 21 3 8"></polyline>
          <rect x="1" y="3" width="22" height="5"></rect>
          <line x1="10" y1="12" x2="14" y2="12"></line>
        </svg>
      </button>

      <button type="button" id="edit-toggle-btn" style="height:36px; padding:0 14px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white; font-size:0.75rem; font-weight:600; cursor:pointer;">
        Edit
      </button>

      <button type="button" id="btn-open-import" style="width:36px; height:36px; border-radius:9999px; background:#0A84FF; color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 12px rgba(10,132,255,0.4);" title="Import App">
        <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- App Grid -->
  <main style="position:relative; z-index:10; flex:1; overflow-y:auto; padding:8px 24px; max-width:540px; margin:0 auto; width:100%;" class="no-scrollbar">
    <div id="empty-state" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:60px 0; gap:16px;">
      <div style="width:64px; height:64px; border-radius:24px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.4);">
        <svg style="width:32px; height:32px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
          <path d="M12 12v9"></path>
          <path d="m8 17 4 4 4-4"></path>
        </svg>
      </div>
      <div>
        <h2 style="font-size:1.1rem; font-weight:700; color:rgba(255,255,255,0.9);">No Apps Installed</h2>
        <p style="font-size:0.75rem; color:rgba(255,255,255,0.5); max-width:260px; margin-top:4px;">Import HTML projects, multi-file folders, or restore backups.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="button" id="empty-import-btn" style="padding:10px 16px; border-radius:14px; background:#0A84FF; color:white; font-size:0.75rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Import App / Folder</span>
        </button>
        <button type="button" id="empty-restore-btn" style="padding:10px 16px; border-radius:14px; background:rgba(255,255,255,0.1); color:white; font-size:0.75rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Restore Backup</span>
        </button>
      </div>
    </div>

    <div id="app-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr)); gap:24px 16px; padding:16px 0; justify-items:center;"></div>
  </main>

  <footer style="position:relative; z-index:20; padding:4px 24px; display:flex; justify-content:center; font-size:11px; color:rgba(255,255,255,0.4);">
    <span>Tap an app to launch full-screen</span>
  </footer>

  <!-- FILE PICKERS -->
  <input type="file" id="folder-picker" webkitdirectory directory multiple style="display:none;">
  <input type="file" id="multifile-picker" multiple accept=".html,.htm,.js,.mjs,.css,.json,.png,.jpg,.jpeg,.svg,.gif,.wav,.mp3,.zip" style="display:none;">
  <input type="file" id="zip-picker" accept=".zip,application/zip,application/x-zip-compressed" style="display:none;">
  <input type="file" id="single-picker" accept=".html,.htm,text/html,text/plain" style="display:none;">
  <input type="file" id="backup-picker" accept=".json,application/json,text/plain" style="display:none;">
  <!-- SVG ICON PICKER FOR IPHONE -->
  <input type="file" id="icon-picker" accept=".svg,image/svg+xml" style="display:none;">

  <!-- IMPORT MODAL -->
  <div id="import-modal" style="position:fixed; inset:0; z-index:50; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:16px;">
    <div class="glass-panel" style="width:100%; max-width:360px; border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <svg style="width:20px; height:20px; color:#0A84FF;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <h2 style="font-size:1rem; font-weight:700; color:white;">Import App or Modules</h2>
        </div>
        <button type="button" class="btn-close-modal" data-target="import-modal" style="background:rgba(255,255,255,0.1); border-radius:9999px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.7); cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" class="import-card-btn" data-picker="folder-picker">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(56,189,248,0.2); display:flex; align-items:center; justify-content:center; color:#38bdf8; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Import Entire Folder</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Picks a folder with index.html, JS, and CSS</div>
          </div>
        </button>

        <button type="button" class="import-card-btn" data-picker="zip-picker">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(245,158,11,0.2); display:flex; align-items:center; justify-content:center; color:#f59e0b; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="21 8 21 21 3 21 3 8"></polyline>
              <rect x="1" y="3" width="22" height="5"></rect>
              <line x1="10" y1="12" x2="14" y2="12"></line>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Import ZIP Archive</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Great for iOS Files app (.zip bundle)</div>
          </div>
        </button>

        <button type="button" class="import-card-btn" data-picker="multifile-picker">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(168,85,247,0.2); display:flex; align-items:center; justify-content:center; color:#c084fc; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Select Multiple Files</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Select all module files together at once</div>
          </div>
        </button>

        <button type="button" class="import-card-btn" data-picker="single-picker">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(16,185,129,0.2); display:flex; align-items:center; justify-content:center; color:#34d399; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Single HTML File</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Standard standalone HTML file</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- RENAME APP MODAL -->
  <div id="rename-modal" style="position:fixed; inset:0; z-index:60; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:16px;">
    <div class="glass-panel" style="width:100%; max-width:320px; border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:16px;">
      <h3 style="font-size:1rem; font-weight:700; color:white;">Rename App</h3>
      <input type="text" id="rename-input" style="width:100%; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; font-size:0.875rem; outline:none;" placeholder="App name">
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-close-modal" data-target="rename-modal" style="flex:1; padding:10px; border-radius:12px; background:rgba(255,255,255,0.1); font-size:0.75rem; font-weight:600; color:white; cursor:pointer;">Cancel</button>
        <button type="button" id="btn-save-rename" style="flex:1; padding:10px; border-radius:12px; background:#0A84FF; font-size:0.75rem; font-weight:600; color:white; cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <!-- BACKUP & DIAGNOSTICS MODAL -->
  <div id="backup-modal" style="position:fixed; inset:0; z-index:50; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:16px;">
    <div class="glass-panel" style="width:100%; max-width:360px; border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <svg style="width:20px; height:20px; color:#0A84FF;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
          </svg>
          <h2 style="font-size:1rem; font-weight:700; color:white;">Backup &amp; Diagnostics</h2>
        </div>
        <button type="button" class="btn-close-modal" data-target="backup-modal" style="background:rgba(255,255,255,0.1); border-radius:9999px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.7); cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" id="btn-save-crash-log" style="width:100%; padding:12px 16px; border-radius:14px; background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span>Save Crash / Debug Log to Files</span>
        </button>

        <button type="button" id="btn-export-all" style="width:100%; padding:12px 16px; border-radius:14px; background:rgba(10,132,255,0.15); border:1px solid rgba(10,132,255,0.4); color:#0A84FF; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>Export All Apps (Save Backup)</span>
        </button>

        <button type="button" id="btn-restore-backup" style="width:100%; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Restore Backup (.json)</span>
        </button>

        <button type="button" id="btn-wipe-all" style="width:100%; padding:10px 16px; border-radius:14px; background:rgba(255,69,58,0.15); border:1px solid rgba(255,69,58,0.3); color:#FF453A; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;">
          <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Delete All Apps</span>
        </button>
      </div>

      <button type="button" class="btn-close-modal" data-target="backup-modal" style="width:100%; padding:10px; border-radius:12px; background:rgba(255,255,255,0.1); font-size:0.75rem; font-weight:600; color:white; cursor:pointer;">
        Done
      </button>
    </div>
  </div>

  <!-- FULLSCREEN APP RUNTIME -->
  <div id="runtime-modal" style="position:fixed; inset:0; z-index:9999; display:none; background:#000000; flex-direction:column; overflow:hidden;">
    <div id="runtime-safe-top" style="width:100%; height:max(env(safe-area-inset-top, 54px), 64px); background:#000000; flex-shrink:0;"></div>

    <!-- Draggable Floating Menu Pill -->
    <div id="floating-menu-container" style="position:fixed; z-index:10000; top:calc(max(env(safe-area-inset-top, 54px), 64px) + 12px); left:16px; user-select:none; -webkit-user-select:none; touch-action:none;">
      <div id="menu-pill" class="floating-glass" style="display:flex; align-items:center; gap:8px; padding:7px 13px; border-radius:9999px; box-shadow:0 8px 24px rgba(0,0,0,0.6); cursor:grab;">
        <svg style="width:14px; height:14px; color:rgba(255,255,255,0.85);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <span style="font-size:0.75rem; font-weight:600; color:rgba(255,255,255,0.95);">Menu</span>
      </div>

      <div id="menu-expanded" class="floating-glass" style="display:none; align-items:center; gap:6px; padding:6px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.7); opacity:1;">
        <button type="button" id="btn-runtime-exit" style="height:34px; padding:0 12px; border-radius:10px; background:rgba(255,255,255,0.15); color:white; font-size:0.75rem; font-weight:600; display:flex; align-items:center; gap:4px; cursor:pointer;">
          <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Exit</span>
        </button>

        <button type="button" id="btn-runtime-logs" style="width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.15); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Download Logs">
          <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
        </button>

        <button type="button" id="btn-runtime-reload" style="width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.15); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Reload">
          <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
        </button>

        <button type="button" id="btn-runtime-collapse" style="width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.8); display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Collapse">
          <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Protected IFrame Viewport -->
    <div style="flex:1; width:100%; min-height:0; position:relative; background:#000000; overflow:hidden;">
      <iframe id="runtime-iframe" style="width:100%; height:100%; border:0; display:block;" allow="bluetooth; web-share"></iframe>
    </div>

    <div id="runtime-safe-bottom" style="width:100%; height:max(env(safe-area-inset-bottom, 20px), 24px); background:#000000; flex-shrink:0;"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="glass-panel" style="position:fixed; bottom:48px; left:50%; transform:translateX(-50%); z-index:99999; display:none; padding:8px 18px; border-radius:9999px; font-size:12px; font-weight:600; color:white; box-shadow:0 8px 24px rgba(0,0,0,0.5);">
    Notification
  </div>

  <!-- ES MODULE ROOT BOOTSTRAP -->
  <script type="module" src="app.js"></script>
</body>
</html>
