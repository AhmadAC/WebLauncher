<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HTML Launcher</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            iosBg: '#090a10',
            iosBlue: '#0A84FF',
            iosRed: '#FF453A',
            iosGreen: '#30D158',
          },
          boxShadow: {
            'app-icon': '0 8px 24px -4px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25)',
          }
        }
      }
    }
  </script>

  <style>
    .squircle {
      border-radius: 22.5%;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-panel {
      background: rgba(22, 24, 32, 0.88);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .app-press:active {
      transform: scale(0.92);
      opacity: 0.85;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .safe-top {
      padding-top: max(env(safe-area-inset-top, 48px), 54px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 24px);
    }

    @keyframes jiggle {
      0% { transform: rotate(-1deg); }
      50% { transform: rotate(1.2deg); }
      100% { transform: rotate(-1deg); }
    }
    .jiggle {
      animation: jiggle 0.25s infinite ease-in-out;
    }

    /* 70% Opacity Floating Bar Styling */
    .floating-glass {
      background: rgba(15, 23, 42, 0.70) !important;
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
  </style>
</head>

<body class="h-full w-full overflow-hidden bg-iosBg text-white font-sans antialiased flex flex-col justify-between relative safe-top safe-bottom">

  <!-- Ambient Wallpaper Background -->
  <div class="fixed inset-0 pointer-events-none z-0 opacity-40">
    <div class="absolute -top-[20%] -left-[10%] w-[80vw] h-[80vw] rounded-full bg-gradient-to-br from-indigo-600/30 via-blue-600/20 to-transparent blur-3xl"></div>
    <div class="absolute top-[35%] -right-[15%] w-[70vw] h-[70vw] rounded-full bg-gradient-to-br from-purple-600/30 via-pink-600/10 to-transparent blur-3xl"></div>
  </div>

  <!-- Top Navigation -->
  <header class="relative z-20 w-full px-6 py-2 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-white flex items-center space-x-2">
        <span>App Launcher</span>
        <span id="app-counter" class="text-xs px-2.5 py-0.5 rounded-full bg-white/10 text-white/70 font-medium">0 Apps</span>
      </h1>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-2.5">
      <button onclick="openModal('backup-modal')" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white/80 flex items-center justify-center transition border border-white/10" title="Backup & Restore">
        <i data-lucide="archive" class="w-4 h-4"></i>
      </button>
      <button id="edit-toggle-btn" onclick="toggleEditMode()" class="h-9 px-3.5 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-semibold text-white/90 backdrop-blur-md transition border border-white/10">
        Edit
      </button>
      <button onclick="triggerFilePicker()" class="w-9 h-9 rounded-full bg-iosBlue text-white hover:bg-blue-600 active:scale-95 transition shadow-lg flex items-center justify-center" title="Import App">
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Container: Dynamic App Grid -->
  <main class="relative z-10 flex-1 overflow-y-auto no-scrollbar px-6 py-4 max-w-lg mx-auto w-full">
    <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-center py-20 space-y-4">
      <div class="w-16 h-16 rounded-3xl bg-white/5 border border-white/10 flex items-center justify-center text-white/40">
        <i data-lucide="download-cloud" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-white/90">No Apps Installed</h2>
        <p class="text-xs text-white/50 max-w-xs mt-1">Import single-file HTML apps or restore a saved backup.</p>
      </div>
      <div class="flex gap-2">
        <button onclick="triggerFilePicker()" class="px-4 py-2.5 rounded-2xl bg-iosBlue hover:bg-blue-600 text-white text-xs font-semibold active:scale-95 transition shadow-lg flex items-center space-x-1.5">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Import HTML</span>
        </button>
        <button onclick="triggerBackupRestore()" class="px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold active:scale-95 transition flex items-center space-x-1.5">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span>Restore Backup</span>
        </button>
      </div>
    </div>

    <div id="app-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-6 py-4 justify-items-center"></div>
  </main>

  <footer class="relative z-20 px-6 py-2 flex justify-center items-center text-[11px] text-white/40">
    <span>Tap an app to launch full-screen</span>
  </footer>

  <!-- Hidden File Inputs -->
  <input type="file" id="file-picker" accept=".html,.htm,text/html,text/plain,.json,application/json" class="hidden" onchange="handleFileSelected(event)">
  <input type="file" id="backup-picker" accept=".json,application/json,text/plain" class="hidden" onchange="handleBackupSelected(event)">

  <!-- BACKUP & RESTORE MODAL -->
  <div id="backup-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-xl justify-center items-center p-4">
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <div class="flex items-center space-x-2">
          <i data-lucide="archive" class="w-5 h-5 text-iosBlue"></i>
          <h2 class="text-base font-bold text-white">Backup & Restore</h2>
        </div>
        <button onclick="closeModal('backup-modal')" class="p-1.5 rounded-full bg-white/10 hover:bg-white/20 text-white/70">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <p class="text-xs text-white/60 leading-relaxed">
        Export your apps into a backup file. If you reinstall or update the IPA, restore the backup to reload all your apps instantly.
      </p>

      <div class="space-y-2.5 pt-2">
        <button onclick="exportAllApps()" class="w-full py-3 px-4 rounded-xl bg-iosBlue/20 hover:bg-iosBlue/30 border border-iosBlue/40 text-iosBlue font-semibold text-xs flex items-center justify-center space-x-2 active:scale-98 transition">
          <i data-lucide="share" class="w-4 h-4"></i>
          <span>Export All Apps (Save Backup)</span>
        </button>

        <button onclick="triggerBackupRestore()" class="w-full py-3 px-4 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 text-white font-semibold text-xs flex items-center justify-center space-x-2 active:scale-98 transition">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span>Restore Backup (.json)</span>
        </button>

        <button onclick="confirmWipeAll()" class="w-full py-2.5 px-4 rounded-xl bg-iosRed/20 hover:bg-iosRed/30 border border-iosRed/30 text-iosRed font-semibold text-xs flex items-center justify-center space-x-1.5 active:scale-98 transition">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span>Delete All Apps</span>
        </button>
      </div>

      <div class="pt-2 text-center">
        <button onclick="closeModal('backup-modal')" class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold text-white">
          Done
        </button>
      </div>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- FULLSCREEN APP RUNTIME WITH 70% DRAGGABLE FLOATING MENU  -->
  <!-- ======================================================== -->
  <div id="runtime-modal" class="fixed inset-0 z-50 hidden bg-black flex-col">
    
    <!-- FLOATING 70% OPACITY DRAGGABLE CONTROLLER -->
    <div id="floating-menu-container" class="fixed z-[100] select-none touch-none" style="top: 60px; right: 16px;">
      
      <!-- Collapsed Draggable Pill (70% Opacity) -->
      <div id="menu-pill" class="floating-glass flex items-center space-x-2 px-3.5 py-2.5 rounded-full shadow-2xl cursor-grab active:cursor-grabbing active:scale-95 transition-transform">
        <i data-lucide="grip-vertical" class="w-3.5 h-3.5 text-white/40"></i>
        <i data-lucide="menu" class="w-3.5 h-3.5 text-white/90"></i>
        <span class="text-xs font-semibold text-white/95">Menu</span>
      </div>

      <!-- Expanded Floating Control Bar (70% Opacity) -->
      <div id="menu-expanded" class="floating-glass hidden items-center space-x-1.5 p-1.5 rounded-2xl shadow-2xl">
        <div class="px-1.5 py-1 flex items-center cursor-grab active:cursor-grabbing text-white/40">
          <i data-lucide="grip-vertical" class="w-3.5 h-3.5"></i>
        </div>
        <button onclick="exitApp()" class="h-9 px-3 rounded-xl bg-white/15 hover:bg-white/25 active:scale-95 text-white text-xs font-semibold flex items-center space-x-1 transition border border-white/10">
          <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          <span>Exit</span>
        </button>
        <button onclick="reloadApp()" class="w-9 h-9 rounded-xl bg-white/15 hover:bg-white/25 active:scale-95 text-white flex items-center justify-center transition border border-white/10" title="Reload">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="collapseFloatingMenu()" class="w-9 h-9 rounded-xl bg-white/15 hover:bg-white/25 active:scale-95 text-white/80 flex items-center justify-center transition border border-white/10" title="Collapse">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

    </div>

    <!-- True 100% Fullscreen App IFrame -->
    <div class="flex-1 w-full h-full relative bg-black overflow-hidden">
      <iframe id="runtime-iframe" class="w-full h-full border-0 block" allow="web-share" sandbox="allow-scripts allow-modals allow-forms allow-same-origin allow-popups allow-downloads"></iframe>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full glass-panel border border-white/20 text-xs font-semibold text-white shadow-xl transition-all">
    Notification
  </div>

  <script>
    const GRADIENTS = [
      "from-blue-600 to-indigo-600",
      "from-purple-600 to-indigo-700",
      "from-pink-600 to-rose-600",
      "from-amber-500 to-orange-600",
      "from-emerald-600 to-teal-700",
      "from-cyan-500 to-blue-600",
      "from-fuchsia-600 to-pink-600",
      "from-red-600 to-rose-700"
    ];

    let db;
    let apps = [];
    let isEditMode = false;
    let activeAppBlobUrl = null;

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('LauncherDB', 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('apps')) {
            database.createObjectStore('apps', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve();
        };
        req.onerror = () => reject("IndexedDB failed to load");
      });
    }

    async function loadApps() {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readonly');
        const store = tx.objectStore('apps');
        const req = store.getAll();
        req.onsuccess = () => {
          apps = req.result || [];
          resolve(apps);
        };
      });
    }

    async function saveAppToDB(app) {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readwrite');
        const store = tx.objectStore('apps');
        store.put(app);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteAppFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readwrite');
        const store = tx.objectStore('apps');
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    async function clearAllAppsFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readwrite');
        const store = tx.objectStore('apps');
        store.clear();
        tx.oncomplete = () => resolve();
      });
    }

    function renderLauncher() {
      const grid = document.getElementById('app-grid');
      const emptyState = document.getElementById('empty-state');
      const counter = document.getElementById('app-counter');
      grid.innerHTML = '';

      counter.innerText = `${apps.length} App${apps.length === 1 ? '' : 's'}`;

      if (apps.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      apps.forEach((app) => {
        const tile = document.createElement('div');
        tile.className = "flex flex-col items-center group relative cursor-pointer";

        tile.innerHTML = `
          <div class="relative ${isEditMode ? 'jiggle' : ''}">
            <button onclick="handleTileClick(${app.id})" class="w-16 h-16 sm:w-20 sm:h-20 squircle bg-gradient-to-tr ${app.gradient} flex items-center justify-center text-white shadow-app-icon app-press relative overflow-hidden">
              <span class="text-2xl font-bold tracking-tight">${app.name.charAt(0).toUpperCase()}</span>
            </button>
            ${isEditMode ? `
              <button onclick="removeApp(event, ${app.id})" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-iosRed text-white flex items-center justify-center shadow-lg border-2 border-slate-950 z-30">
                <i data-lucide="x" class="w-3.5 h-3.5 stroke-[3]"></i>
              </button>
            ` : ''}
          </div>
          <span class="mt-2 text-xs font-semibold text-white/90 truncate w-20 text-center tracking-tight drop-shadow-sm">${escapeHtml(app.name)}</span>
        `;
        grid.appendChild(tile);
      });

      if (!isEditMode) {
        const addTile = document.createElement('div');
        addTile.className = "flex flex-col items-center group cursor-pointer";
        addTile.innerHTML = `
          <button onclick="triggerFilePicker()" class="w-16 h-16 sm:w-20 sm:h-20 squircle bg-white/5 hover:bg-white/10 border-2 border-dashed border-white/20 hover:border-white/40 flex flex-col items-center justify-center text-white/40 hover:text-white/80 transition app-press">
            <i data-lucide="plus" class="w-6 h-6 stroke-[2]"></i>
          </button>
          <span class="mt-2 text-xs font-medium text-white/40 truncate w-20 text-center">Add App</span>
        `;
        grid.appendChild(addTile);
      }

      lucide.createIcons();
    }

    function handleTileClick(id) {
      if (isEditMode) return;
      const targetApp = apps.find(a => a.id === id);
      if (targetApp) launchApp(targetApp);
    }

    function triggerFilePicker() {
      const input = document.getElementById('file-picker');
      input.value = '';
      input.click();
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const fileContent = e.target.result;

        if (file.name.endsWith('.json') || file.type === 'application/json') {
          processBackupContent(fileContent);
          return;
        }

        let appName = file.name.replace(/\.[^/.]+$/, "");
        const titleMatch = fileContent.match(/<title[^>]*>([^<]+)<\/title>/i);
        if (titleMatch && titleMatch[1].trim()) {
          appName = titleMatch[1].trim();
        }

        const newApp = {
          id: Date.now(),
          name: appName,
          gradient: GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
          code: fileContent,
          timestamp: Date.now()
        };

        await saveAppToDB(newApp);
        await loadApps();
        renderLauncher();
        showToast(`"${appName}" imported!`);
      };

      reader.readAsText(file);
    }

    async function exportAllApps() {
      if (!apps || apps.length === 0) {
        showToast("No apps installed to export!");
        return;
      }

      const dateIso = new Date().toISOString().split('T')[0];
      const filename = `weblauncher-backup-${dateIso}.json`;
      
      const backupData = {
        version: 1,
        source: "WebLauncher",
        exportedAt: new Date().toISOString(),
        totalApps: apps.length,
        apps: apps
      };

      const jsonStr = JSON.stringify(backupData, null, 2);

      if (navigator.share) {
        try {
          const file = new File([jsonStr], filename, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: "WebLauncher Apps Backup"
            });
            showToast("Backup saved!");
            closeModal('backup-modal');
            return;
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      navigator.clipboard.writeText(jsonStr).then(() => {
        showToast("Backup JSON copied to clipboard!");
      }).catch(() => {
        showToast("Failed to export backup.");
      });
    }

    function triggerBackupRestore() {
      const input = document.getElementById('backup-picker');
      input.value = '';
      input.click();
    }

    function handleBackupSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        processBackupContent(e.target.result);
      };
      reader.readAsText(file);
    }

    async function processBackupContent(rawContent) {
      try {
        const parsed = JSON.parse(rawContent);
        const importedApps = Array.isArray(parsed) ? parsed : (parsed.apps || []);

        if (!Array.isArray(importedApps) || importedApps.length === 0) {
          showToast("No valid apps found in backup file.");
          return;
        }

        let restoredCount = 0;
        for (const item of importedApps) {
          if (item && item.name && item.code) {
            const appObj = {
              id: item.id || Date.now() + Math.floor(Math.random() * 1000),
              name: item.name,
              gradient: item.gradient || GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
              code: item.code,
              timestamp: item.timestamp || Date.now()
            };
            await saveAppToDB(appObj);
            restoredCount++;
          }
        }

        await loadApps();
        renderLauncher();
        closeModal('backup-modal');
        showToast(`Restored ${restoredCount} apps!`);
      } catch (err) {
        showToast("Invalid backup JSON file.");
      }
    }

    async function confirmWipeAll() {
      if (confirm("Delete ALL apps? Make sure you exported a backup first.")) {
        await clearAllAppsFromDB();
        await loadApps();
        renderLauncher();
        closeModal('backup-modal');
        showToast("All apps deleted.");
      }
    }

    async function removeApp(event, id) {
      event.stopPropagation();
      await deleteAppFromDB(id);
      await loadApps();
      renderLauncher();
      showToast("App deleted.");
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('edit-toggle-btn');
      btn.innerText = isEditMode ? 'Done' : 'Edit';
      btn.className = isEditMode 
        ? 'h-9 px-3.5 rounded-full bg-iosBlue text-white text-xs font-bold transition shadow-md'
        : 'h-9 px-3.5 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-xs font-semibold text-white/90 backdrop-blur-md transition border border-white/10';
      renderLauncher();
    }

    // ========================================================
    // 70% OPACITY FLOATING DRAGGABLE CONTROLLER LOGIC
    // ========================================================
    const floatingContainer = document.getElementById('floating-menu-container');
    const menuPill = document.getElementById('menu-pill');
    const menuExpanded = document.getElementById('menu-expanded');

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialLeft = 0;
    let initialTop = 0;
    let hasMoved = false;

    // Draggable gesture detection
    floatingContainer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return; // Ignore drag if tapping action button

      isDragging = true;
      hasMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = floatingContainer.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      floatingContainer.setPointerCapture(e.pointerId);
    });

    floatingContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      if (Math.hypot(dx, dy) > 5) {
        hasMoved = true;
      }

      if (hasMoved) {
        const rect = floatingContainer.getBoundingClientRect();
        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        // Keep within safe screen boundaries
        const margin = 12;
        const maxLeft = window.innerWidth - rect.width - margin;
        const maxTop = window.innerHeight - rect.height - margin;

        newLeft = Math.max(margin, Math.min(newLeft, maxLeft));
        newTop = Math.max(margin, Math.min(newTop, maxTop));

        floatingContainer.style.left = `${newLeft}px`;
        floatingContainer.style.top = `${newTop}px`;
        floatingContainer.style.right = 'auto'; // Clear CSS right
      }
    });

    floatingContainer.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;

      try {
        floatingContainer.releasePointerCapture(e.pointerId);
      } catch (err) {}

      // If it was a tap (not dragged), toggle expand/collapse
      if (!hasMoved) {
        toggleFloatingMenu();
      }
    });

    function toggleFloatingMenu() {
      if (menuExpanded.classList.contains('hidden')) {
        menuPill.classList.add('hidden');
        menuExpanded.classList.remove('hidden');
        menuExpanded.classList.add('flex');
      } else {
        collapseFloatingMenu();
      }
      lucide.createIcons();
    }

    function collapseFloatingMenu() {
      menuExpanded.classList.add('hidden');
      menuExpanded.classList.remove('flex');
      menuPill.classList.remove('hidden');
      lucide.createIcons();
    }

    function launchApp(app) {
      const iframe = document.getElementById('runtime-iframe');
      collapseFloatingMenu();

      if (activeAppBlobUrl) {
        URL.revokeObjectURL(activeAppBlobUrl);
      }
      const blob = new Blob([app.code], { type: 'text/html;charset=utf-8' });
      activeAppBlobUrl = URL.createObjectURL(blob);
      iframe.src = activeAppBlobUrl;

      document.getElementById('runtime-modal').classList.remove('hidden');
      document.getElementById('runtime-modal').classList.add('flex');
    }

    function exitApp() {
      const modal = document.getElementById('runtime-modal');
      const iframe = document.getElementById('runtime-iframe');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      iframe.src = 'about:blank';
      if (activeAppBlobUrl) {
        URL.revokeObjectURL(activeAppBlobUrl);
        activeAppBlobUrl = null;
      }
    }

    function reloadApp() {
      const iframe = document.getElementById('runtime-iframe');
      if (activeAppBlobUrl) {
        iframe.src = activeAppBlobUrl;
      }
    }

    // Modal Helpers
    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2400);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      await loadApps();
      renderLauncher();
      lucide.createIcons();
    });
  </script>
</body>
</html>
