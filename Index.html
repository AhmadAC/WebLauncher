<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HTML Launcher</title>
  
  <!-- Capacitor Native Runtime Bridge -->
  <script src="capacitor.js"></script>

  <style>
    /* 100% OFFLINE EMBEDDED STYLES (Zero external CDN fetches) */
    *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #334155; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background-color: #090a10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      padding-top: max(env(safe-area-inset-top, 54px), 64px);
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 24px);
    }

    .squircle { border-radius: 22.5%; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-panel {
      background: rgba(22, 24, 32, 0.88);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .floating-glass {
      background: rgba(15, 23, 42, 0.85) !important;
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* 60% default opacity for floating menu pill */
    #menu-pill {
      opacity: 0.6;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    #menu-pill:active, .is-dragging #menu-pill {
      opacity: 1 !important;
      transform: scale(1.04);
    }

    .app-press:active {
      transform: scale(0.92);
      opacity: 0.85;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    @keyframes jiggle {
      0% { transform: rotate(-1deg); }
      50% { transform: rotate(1.2deg); }
      100% { transform: rotate(-1deg); }
    }
    .jiggle { animation: jiggle 0.25s infinite ease-in-out; }

    .from-blue-600 { background-image: linear-gradient(135deg, #2563eb, #4338ca); }
    .from-purple-600 { background-image: linear-gradient(135deg, #9333ea, #4f46e5); }
    .from-pink-600 { background-image: linear-gradient(135deg, #db2777, #e11d48); }
    .from-amber-500 { background-image: linear-gradient(135deg, #f59e0b, #ea580c); }
    .from-emerald-600 { background-image: linear-gradient(135deg, #059669, #0f766e); }
    .from-cyan-500 { background-image: linear-gradient(135deg, #06b6d4, #2563eb); }
    .from-fuchsia-600 { background-image: linear-gradient(135deg, #c026d3, #db2777); }
    .from-red-600 { background-image: linear-gradient(135deg, #dc2626, #be123c); }

    .import-card-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
    }
    .import-card-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .import-card-btn:active { transform: scale(0.98); }
  </style>
</head>

<body>

  <!-- Background Ambient Glow -->
  <div style="position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.4;">
    <div style="position:absolute; top:-20%; left:-10%; width:80vw; height:80vw; border-radius:9999px; background:radial-gradient(circle, rgba(79,70,229,0.3) 0%, transparent 70%); filter:blur(40px);"></div>
    <div style="position:absolute; top:35%; right:-15%; width:70vw; height:70vw; border-radius:9999px; background:radial-gradient(circle, rgba(147,51,234,0.3) 0%, transparent 70%); filter:blur(40px);"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header style="position:relative; z-index:20; width:100%; padding:0 24px 10px 24px; display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h1 style="font-size:1.25rem; font-weight:700; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px;">
        <span>App Launcher</span>
        <span id="app-counter" style="font-size:0.75rem; padding:2px 10px; border-radius:9999px; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); font-weight:500;">0 Apps</span>
      </h1>
    </div>

    <!-- Actions -->
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" onclick="downloadAppLogs()" style="width:36px; height:36px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Download Crash / Debug Log">
        <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
      </button>

      <button type="button" onclick="openModal('backup-modal')" style="width:36px; height:36px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer;" title="Backup & Diagnostics">
        <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 8 21 21 3 21 3 8"></polyline>
          <rect x="1" y="3" width="22" height="5"></rect>
          <line x1="10" y1="12" x2="14" y2="12"></line>
        </svg>
      </button>

      <button type="button" id="edit-toggle-btn" onclick="toggleEditMode()" style="height:36px; padding:0 14px; border-radius:9999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white; font-size:0.75rem; font-weight:600; cursor:pointer;">
        Edit
      </button>

      <button type="button" onclick="openModal('import-modal')" style="width:36px; height:36px; border-radius:9999px; background:#0A84FF; color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 12px rgba(10,132,255,0.4);" title="Import App">
        <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- App Grid -->
  <main style="position:relative; z-index:10; flex:1; overflow-y:auto; padding:8px 24px; max-width:540px; margin:0 auto; width:100%;" class="no-scrollbar">
    <div id="empty-state" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:60px 0; gap:16px;">
      <div style="width:64px; height:64px; border-radius:24px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.4);">
        <svg style="width:32px; height:32px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
          <path d="M12 12v9"></path>
          <path d="m8 17 4 4 4-4"></path>
        </svg>
      </div>
      <div>
        <h2 style="font-size:1.1rem; font-weight:700; color:rgba(255,255,255,0.9);">No Apps Installed</h2>
        <p style="font-size:0.75rem; color:rgba(255,255,255,0.5); max-width:260px; margin-top:4px;">Import HTML projects, multi-file folders, or restore backups.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="button" onclick="openModal('import-modal')" style="padding:10px 16px; border-radius:14px; background:#0A84FF; color:white; font-size:0.75rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Import App / Folder</span>
        </button>
        <button type="button" onclick="triggerBackupRestore()" style="padding:10px 16px; border-radius:14px; background:rgba(255,255,255,0.1); color:white; font-size:0.75rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Restore Backup</span>
        </button>
      </div>
    </div>

    <div id="app-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr)); gap:24px 16px; padding:16px 0; justify-items:center;"></div>
  </main>

  <footer style="position:relative; z-index:20; padding:4px 24px; display:flex; justify-content:center; font-size:11px; color:rgba(255,255,255,0.4);">
    <span>Tap an app to launch full-screen</span>
  </footer>

  <!-- FILE PICKERS -->
  <input type="file" id="folder-picker" webkitdirectory directory multiple style="display:none;" onchange="handleFolderSelected(event)">
  <input type="file" id="multifile-picker" multiple accept=".html,.htm,.js,.mjs,.css,.json,.png,.jpg,.jpeg,.svg,.gif,.wav,.mp3,.zip" style="display:none;" onchange="handleMultiFilesSelected(event)">
  <input type="file" id="zip-picker" accept=".zip,application/zip,application/x-zip-compressed" style="display:none;" onchange="handleZipSelected(event)">
  <input type="file" id="single-picker" accept=".html,.htm,text/html,text/plain" style="display:none;" onchange="handleSingleFileSelected(event)">
  <input type="file" id="backup-picker" accept=".json,application/json,text/plain" style="display:none;" onchange="handleBackupSelected(event)">

  <!-- IMPORT MODAL -->
  <div id="import-modal" style="position:fixed; inset:0; z-index:50; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:16px;">
    <div class="glass-panel" style="width:100%; max-width:360px; border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <svg style="width:20px; height:20px; color:#0A84FF;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <h2 style="font-size:1rem; font-weight:700; color:white;">Import App or Modules</h2>
        </div>
        <button type="button" onclick="closeModal('import-modal')" style="background:rgba(255,255,255,0.1); border-radius:9999px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.7); cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <!-- Option 1: Folder Upload -->
        <button type="button" class="import-card-btn" onclick="triggerPicker('folder-picker')">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(56,189,248,0.2); display:flex; align-items:center; justify-content:center; color:#38bdf8; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Import Entire Folder</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Picks a folder with index.html, JS, and CSS</div>
          </div>
        </button>

        <!-- Option 2: ZIP File Upload -->
        <button type="button" class="import-card-btn" onclick="triggerPicker('zip-picker')">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(245,158,11,0.2); display:flex; align-items:center; justify-content:center; color:#f59e0b; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="21 8 21 21 3 21 3 8"></polyline>
              <rect x="1" y="3" width="22" height="5"></rect>
              <line x1="10" y1="12" x2="14" y2="12"></line>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Import ZIP Archive</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Great for iOS Files app (.zip bundle)</div>
          </div>
        </button>

        <!-- Option 3: Multiple Files Selection -->
        <button type="button" class="import-card-btn" onclick="triggerPicker('multifile-picker')">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(168,85,247,0.2); display:flex; align-items:center; justify-content:center; color:#c084fc; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Select Multiple Files</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Select all module files together at once</div>
          </div>
        </button>

        <!-- Option 4: Single HTML File -->
        <button type="button" class="import-card-btn" onclick="triggerPicker('single-picker')">
          <div style="width:36px; height:36px; border-radius:10px; background:rgba(16,185,129,0.2); display:flex; align-items:center; justify-content:center; color:#34d399; flex-shrink:0;">
            <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </div>
          <div>
            <div style="font-size:0.85rem; font-weight:700;">Single HTML File</div>
            <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);">Standard standalone HTML file</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- RENAME APP MODAL -->
  <div id="rename-modal" style="position:fixed; inset:0; z-index:60; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:16px;">
    <div class="glass-panel" style="width:100%; max-width:320px; border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:16px;">
      <h3 style="font-size:1rem; font-weight:700; color:white;">Rename App</h3>
      <input type="text" id="rename-input" style="width:100%; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; font-size:0.875rem; outline:none;" placeholder="App name">
      <div style="display:flex; gap:8px;">
        <button type="button" onclick="closeModal('rename-modal')" style="flex:1; padding:10px; border-radius:12px; background:rgba(255,255,255,0.1); font-size:0.75rem; font-weight:600; color:white; cursor:pointer;">Cancel</button>
        <button type="button" onclick="saveRename()" style="flex:1; padding:10px; border-radius:12px; background:#0A84FF; font-size:0.75rem; font-weight:600; color:white; cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <!-- BACKUP & DIAGNOSTICS MODAL -->
  <div id="backup-modal" style="position:fixed; inset:0; z-index:50; display:none; background:rgba(0,0,0,0.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); align-items:center; justify-content:center; padding:16px;">
    <div class="glass-panel" style="width:100%; max-width:360px; border-radius:24px; padding:24px; display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <svg style="width:20px; height:20px; color:#0A84FF;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
          </svg>
          <h2 style="font-size:1rem; font-weight:700; color:white;">Backup &amp; Diagnostics</h2>
        </div>
        <button type="button" onclick="closeModal('backup-modal')" style="background:rgba(255,255,255,0.1); border-radius:9999px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.7); cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button type="button" onclick="downloadAppLogs()" style="width:100%; padding:12px 16px; border-radius:14px; background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span>Save Crash / Debug Log to Files</span>
        </button>

        <button type="button" onclick="exportAllApps()" style="width:100%; padding:12px 16px; border-radius:14px; background:rgba(10,132,255,0.15); border:1px solid rgba(10,132,255,0.4); color:#0A84FF; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>Export All Apps (Save Backup)</span>
        </button>

        <button type="button" onclick="triggerBackupRestore()" style="width:100%; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.1); color:white; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Restore Backup (.json)</span>
        </button>

        <button type="button" onclick="confirmWipeAll()" style="width:100%; padding:10px 16px; border-radius:14px; background:rgba(255,69,58,0.15); border:1px solid rgba(255,69,58,0.3); color:#FF453A; font-weight:600; font-size:0.75rem; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;">
          <svg style="width:14px; height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>

  <script>
    // =========================================================================
    // PERSISTENT CRASH LOGGER
    // =========================================================================
    const LOG_KEY = 'weblauncher_debug_log_v2';
    let systemLogs = [];

    function recordLog(level, msg) {
      const line = `[${new Date().toISOString()}] [${level}] ${msg}`;
      systemLogs.push(line);
      if (systemLogs.length > 500) systemLogs.shift();
      try {
        localStorage.setItem(LOG_KEY, JSON.stringify(systemLogs));
      } catch (e) {}
    }

    try {
      const prev = localStorage.getItem(LOG_KEY);
      if (prev) systemLogs = JSON.parse(prev);
    } catch (e) {}

    window.recordChildLog = function(level, msg) {
      recordLog(level, msg);
    };

    const _cLog = console.log, _cWarn = console.warn, _cErr = console.error;
    console.log = function(...a) { recordLog('INFO', a.join(' ')); _cLog.apply(console, a); };
    console.warn = function(...a) { recordLog('WARN', a.join(' ')); _cWarn.apply(console, a); };
    console.error = function(...a) { recordLog('ERROR', a.join(' ')); _cErr.apply(console, a); };

    window.onerror = function(m, u, l, c, e) {
      recordLog('FATAL_JS_ERR', `${m} at ${u}:${l}:${c} Stack: ${e?.stack || 'none'}`);
      return false;
    };

    window.onunhandledrejection = function(e) {
      recordLog('UNHANDLED_REJECTION', `Reason: ${e.reason?.message || e.reason}`);
    };

    recordLog('BOOT', `Launcher booted. Viewport: ${window.innerWidth}x${window.innerHeight}`);

    function downloadAppLogs() {
      const header = `====================================================\nWEBLAUNCHER DIAGNOSTIC & CRASH LOG\nExported: ${new Date().toISOString()}\nUser-Agent: ${navigator.userAgent}\nTotal Entries: ${systemLogs.length}\n====================================================\n\n`;
      const content = header + systemLogs.join('\n');
      const filename = `weblauncher-crash-log-${new Date().toISOString().replace(/[:.]/g, '-')}.txt`;

      if (navigator.share && navigator.canShare) {
        try {
          const file = new File([content], filename, { type: 'text/plain' });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "WebLauncher Crash Log" }).catch(() => {});
            return;
          }
        } catch (e) {}
      }

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // =========================================================================
    // DATABASE & APP ENGINE
    // =========================================================================
    const GRADIENTS = [
      "from-blue-600",
      "from-purple-600",
      "from-pink-600",
      "from-amber-500",
      "from-emerald-600",
      "from-cyan-500",
      "from-fuchsia-600",
      "from-red-600"
    ];

    let db;
    let apps = [];
    let isEditMode = false;
    let currentRunningApp = null;
    let appBeingRenamedId = null;
    let activeBlobUrls = [];

    function getCapacitorBle() {
      return window.Capacitor?.Plugins?.BluetoothLe || null;
    }
    window.BluetoothLe = getCapacitorBle();

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('LauncherDB', 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('apps')) {
            database.createObjectStore('apps', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve();
        };
        req.onerror = () => reject("IndexedDB failed to load");
      });
    }

    async function loadApps() {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readonly');
        const store = tx.objectStore('apps');
        const req = store.getAll();
        req.onsuccess = () => {
          apps = req.result || [];
          resolve(apps);
        };
      });
    }

    async function saveAppToDB(app) {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readwrite');
        const store = tx.objectStore('apps');
        store.put(app);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteAppFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readwrite');
        const store = tx.objectStore('apps');
        store.delete(id);
        if (!isNaN(Number(id))) {
          store.delete(Number(id));
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    async function clearAllAppsFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction('apps', 'readwrite');
        const store = tx.objectStore('apps');
        store.clear();
        tx.oncomplete = () => resolve();
      });
    }

              <span style="font-size:1.6rem; font-weight:700; letter-spacing:-0.03em;">${escapeHtml(app.name.charAt(0).toUpperCase())}</span>
            </button>

                ${fileCount}f

            ` : ''}
            ${isEditMode ? `
              <!-- Delete Button -->
              <button type="button" onclick="removeApp(event, '${appIdStr}')" class="edit-action-btn" title="Delete App" style="position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:9999px; background:#FF453A; color:white; display:flex; align-items:center; justify-content:center; border:2px solid #090a10; z-index:30; cursor:pointer;">

                <svg style="width:11px; height:11px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>

              <!-- Export Single App Button -->
              <button type="button" onclick="exportSingleApp(event, '${appIdStr}')" class="edit-action-btn" title="Export HTML File" style="position:absolute; bottom:-6px; right:-6px; width:22px; height:22px; border-radius:9999px; background:#30D158; color:white; display:flex; align-items:center; justify-content:center; border:2px solid #090a10; z-index:30; cursor:pointer;">
                <svg style="width:11px; height:11px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </button>
            ` : ''}
          </div>
          <span style="margin-top:8px; font-size:12px; font-weight:600; color:rgba(255,255,255,0.9); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:80px; text-align:center; pointer-events:none;">${escapeHtml(app.name)}</span>
        `;
        grid.appendChild(tile);
      });

      if (!isEditMode) {
        const addTile = document.createElement('div');
        addTile.style.cssText = "display:flex; flex-direction:column; align-items:center; cursor:pointer;";
        addTile.onclick = () => openModal('import-modal');
        addTile.innerHTML = `
          <button type="button" class="squircle app-press" style="width:68px; height:68px; background:rgba(255,255,255,0.05); border:2px dashed rgba(255,255,255,0.2); display:flex; flex-direction:column; align-items:center; justify-content:center; color:rgba(255,255,255,0.4); cursor:pointer; pointer-events:none;">
            <svg style="width:24px; height:24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <span style="margin-top:8px; font-size:12px; font-weight:500; color:rgba(255,255,255,0.4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:80px; text-align:center; pointer-events:none;">Add App</span>
        `;
        grid.appendChild(addTile);
      }
    }

    function handleTileClick(id) {
      if (isEditMode) return;
      const targetApp = apps.find(a => String(a.id) === String(id));
      if (targetApp) {
        launchApp(targetApp);
      } else {
        showToast("Error: App not found.");
      }
    }

    function triggerFilePicker() {
      openModal('import-modal');
    }

    function triggerPicker(id) {
      closeModal('import-modal');
      const input = document.getElementById(id);
      input.value = '';
      input.click();
    }

    // =========================================================================
    // MULTI-FILE, FOLDER & ZIP INGESTION ENGINE
    // =========================================================================
    function getMimeType(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const types = {
        'html': 'text/html',
        'htm': 'text/html',
        'css': 'text/css',
        'js': 'application/javascript',
        'mjs': 'application/javascript',
        'json': 'application/json',
        'svg': 'image/svg+xml',
        'png': 'image/png',
        'jpg': 'image/jpeg',
        'jpeg': 'image/jpeg',
        'gif': 'image/gif',
        'webp': 'image/webp',
        'wav': 'audio/wav',
        'mp3': 'audio/mpeg',
        'ogg': 'audio/ogg',
        'txt': 'text/plain'
      };
      return types[ext] || 'application/octet-stream';
    }

    function isTextFile(mime) {
      return mime.startsWith('text/') || mime === 'application/javascript' || mime === 'application/json' || mime === 'image/svg+xml';
    }

    function normalizeFileTree(files) {
      const keys = Object.keys(files);
      if (keys.length === 0) return files;

      const parts = keys.map(k => k.split('/'));
      if (parts.every(p => p.length > 1 && p[0] === parts[0][0])) {
        const rootDir = parts[0][0] + '/';
        const normalized = {};
        for (const k of keys) {
          normalized[k.slice(rootDir.length)] = files[k];
        }
        return normalized;
      }
      return files;
    }

    async function readFileContent(file) {
      return new Promise((resolve) => {
        const mime = getMimeType(file.name);
        const reader = new FileReader();

        if (isTextFile(mime)) {
          reader.onload = (e) => resolve({ content: e.target.result, isBinary: false, type: mime });
          reader.readAsText(file);
        } else {
          reader.onload = (e) => {
            const bytes = new Uint8Array(e.target.result);
            let binaryStr = '';
            for (let i = 0; i < bytes.byteLength; i++) {
              binaryStr += String.fromCharCode(bytes[i]);
            }
            resolve({ content: btoa(binaryStr), isBinary: true, type: mime });
          };
          reader.readAsArrayBuffer(file);
        }
      });
    }

    // 1. Folder Selection
    async function handleFolderSelected(event) {
      const filesList = Array.from(event.target.files);
      if (!filesList || filesList.length === 0) return;

      const appFiles = {};
      let appName = 'My App';

      const firstRel = filesList[0].webkitRelativePath || '';
      if (firstRel.includes('/')) {
        appName = firstRel.split('/')[0];
      }

      for (const file of filesList) {
        if (file.name === '.DS_Store' || file.webkitRelativePath.includes('__MACOSX/')) continue;
        let relPath = file.webkitRelativePath || file.name;
        if (relPath.startsWith(appName + '/')) {
          relPath = relPath.substring(appName.length + 1);
        }
        appFiles[relPath] = await readFileContent(file);
      }

      await finalizeMultiFileApp(appFiles, appName);
    }

    // 2. Multi-File Selection
    async function handleMultiFilesSelected(event) {
      const filesList = Array.from(event.target.files);
      if (!filesList || filesList.length === 0) return;

      if (filesList.length === 1 && (filesList[0].name.endsWith('.zip') || filesList[0].type.includes('zip'))) {
        await processZipFile(filesList[0]);
        return;
      }

      const appFiles = {};
      let appName = 'Robot App';

      for (const file of filesList) {
        if (file.name === '.DS_Store') continue;
        appFiles[file.name] = await readFileContent(file);
      }

      await finalizeMultiFileApp(appFiles, appName);
    }

    // 3. ZIP Archive Selection
    async function handleZipSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      await processZipFile(file);
    }

    async function processZipFile(file) {
      const zipName = file.name.replace(/\.[^/.]+$/, "");
      showToast("Unpacking ZIP modules...");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const extracted = await parseZipBuffer(arrayBuffer);
        const normalized = normalizeFileTree(extracted);
        await finalizeMultiFileApp(normalized, zipName);
      } catch (err) {
        recordLog('ZIP_ERR', `Extraction failed: ${err.message}`);
        showToast("Error reading ZIP file.");
      }
    }

    // Pure Offline ZIP Parser using browser native DecompressionStream('deflate-raw')
    async function parseZipBuffer(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      const files = {};

      let eocdOffset = -1;
      for (let i = arrayBuffer.byteLength - 22; i >= 0; i--) {
        if (view.getUint32(i, true) === 0x06054b50) {
          eocdOffset = i;
          break;
        }
      }

      if (eocdOffset === -1) {
        throw new Error("End of Central Directory not found in ZIP.");
      }

      const totalEntries = view.getUint16(eocdOffset + 10, true);
      const cdOffset = view.getUint32(eocdOffset + 16, true);

      let cur = cdOffset;
      for (let i = 0; i < totalEntries; i++) {
        if (view.getUint32(cur, true) !== 0x02014b50) break;

        const method = view.getUint16(cur + 10, true);
        const compressedSize = view.getUint32(cur + 20, true);
        const uncompressedSize = view.getUint32(cur + 24, true);
        const fnLen = view.getUint16(cur + 28, true);
        const extraLen = view.getUint16(cur + 30, true);
        const commentLen = view.getUint16(cur + 32, true);
        const localOffset = view.getUint32(cur + 42, true);

        const filenameBytes = new Uint8Array(arrayBuffer, cur + 46, fnLen);
        const filename = new TextDecoder().decode(filenameBytes);

        cur += 46 + fnLen + extraLen + commentLen;

        if (filename.endsWith('/') || filename.includes('__MACOSX/') || filename.endsWith('.DS_Store')) {
          continue;
        }

        if (view.getUint32(localOffset, true) !== 0x04034b50) continue;
        const localFnLen = view.getUint16(localOffset + 26, true);
        const localExtraLen = view.getUint16(localOffset + 28, true);
        const dataOffset = localOffset + 30 + localFnLen + localExtraLen;

        let decompressedBytes = null;
        if (method === 0) {
          decompressedBytes = new Uint8Array(arrayBuffer, dataOffset, uncompressedSize);
        } else if (method === 8) {
          const compressed = new Uint8Array(arrayBuffer, dataOffset, compressedSize);
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('deflate-raw');
            const writer = ds.writable.getWriter();
            writer.write(compressed);
            writer.close();
            const resp = new Response(ds.readable);
            const buf = await resp.arrayBuffer();
            decompressedBytes = new Uint8Array(buf);
          } else {
            throw new Error("DecompressionStream is unsupported on this device.");
          }
        } else {
          continue;
        }

        const mime = getMimeType(filename);
        const isText = isTextFile(mime);

        if (isText) {
          files[filename] = {
            content: new TextDecoder().decode(decompressedBytes),
            type: mime,
            isBinary: false
          };
        } else {
          let binaryStr = '';
          for (let b = 0; b < decompressedBytes.byteLength; b++) {
            binaryStr += String.fromCharCode(decompressedBytes[b]);
          }
          files[filename] = {
            content: btoa(binaryStr),
            type: mime,
            isBinary: true
          };
        }
      }

      return files;
    }

    // 4. Single HTML Selection
    async function handleSingleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const content = await readFileContent(file);
      let appName = file.name.replace(/\.[^/.]+$/, "");
      const titleMatch = content.content.match(/<title[^>]*>([^<]+)<\/title>/i);
      if (titleMatch && titleMatch[1].trim()) {
        appName = titleMatch[1].trim();
      }

      const files = {};
      files["index.html"] = content;
      await finalizeMultiFileApp(files, appName);
    }

    // Common Finalizer for Multi-File Bundling
    async function finalizeMultiFileApp(appFiles, fallbackName) {
      const fileKeys = Object.keys(appFiles);
      if (fileKeys.length === 0) {
        showToast("No usable files found.");
        return;
      }

      let entryName = fileKeys.find(k => k.toLowerCase() === 'index.html' || k.toLowerCase() === 'index.htm');
      if (!entryName) {
        entryName = fileKeys.find(k => k.endsWith('.html') || k.endsWith('.htm')) || fileKeys[0];
      }

      let finalName = fallbackName;
      if (appFiles[entryName] && !appFiles[entryName].isBinary) {
        const titleMatch = appFiles[entryName].content.match(/<title[^>]*>([^<]+)<\/title>/i);
        if (titleMatch && titleMatch[1].trim()) {
          finalName = titleMatch[1].trim();
        }
      }

      const newApp = {
        id: Date.now(),
        name: finalName,
        gradient: GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
        entry: entryName,
        files: appFiles,
        code: appFiles[entryName] ? appFiles[entryName].content : '',
        timestamp: Date.now()
      };

      await saveAppToDB(newApp);
      await loadApps();
      renderLauncher();
      recordLog('APP_SAVED', `Installed: "${finalName}" (${fileKeys.length} files, entry: ${entryName})`);
      showToast(`Installed "${finalName}" (${fileKeys.length} files)!`);
    }

    // =========================================================================
    // INDIVIDUAL APP ACTIONS (RENAME & EXPORT HTML)
    // =========================================================================
    function promptRenameApp(event, id) {
      event.stopPropagation();
      const targetApp = apps.find(a => String(a.id) === String(id));
      if (!targetApp) return;

      appBeingRenamedId = targetApp.id;
      const input = document.getElementById('rename-input');
      input.value = targetApp.name;
      openModal('rename-modal');
      setTimeout(() => input.focus(), 150);
    }

    async function saveRename() {
      const input = document.getElementById('rename-input');
      const newName = input.value.trim();

      if (!newName) {
        showToast("Name cannot be empty.");
        return;
      }

      const targetApp = apps.find(a => String(a.id) === String(appBeingRenamedId));
      if (targetApp) {
        targetApp.name = newName;
        await saveAppToDB(targetApp);
        await loadApps();
        renderLauncher();
        showToast("App renamed!");
      }
      closeModal('rename-modal');
    }

    // Assembles self-contained runnable HTML for exporting
    function getExportableCode(targetApp) {
      if (!targetApp.files || Object.keys(targetApp.files).length <= 1) {
        return targetApp.code || (targetApp.files && Object.values(targetApp.files)[0]?.content) || '';
      }

      const entryKey = targetApp.entry || 'index.html';
      const entryFile = targetApp.files[entryKey] || Object.values(targetApp.files)[0];
      let html = entryFile.content || '';

      // Inline CSS
      html = html.replace(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
        const cleanHref = href.replace(/^\.\//, '');
        if (targetApp.files[cleanHref] && !targetApp.files[cleanHref].isBinary) {
          return `<style data-source="${cleanHref}">\n${targetApp.files[cleanHref].content}\n</style>`;
        }
        return match;
      });

      // Inline non-module Scripts
      html = html.replace(/<script([^>]+)src=["']([^"']+)["']([^>]*)><\/script>/gi, (match, pre, src, post) => {
        const cleanSrc = src.replace(/^\.\//, '');
        if (targetApp.files[cleanSrc] && !targetApp.files[cleanSrc].isBinary && !pre.includes('type="module"')) {
          return `<script${pre}${post}>\n${targetApp.files[cleanSrc].content}\n<\/script>`;
        }
        return match;
      });

      return html;
    }

    async function exportSingleApp(event, id) {
      event.stopPropagation();
      const targetApp = apps.find(a => String(a.id) === String(id));
      if (!targetApp) {
        showToast("Could not find app to export.");
        return;
      }

      const codeToExport = getExportableCode(targetApp);
      const safeFilename = `${targetApp.name.toLowerCase().replace(/[^a-z0-9_-]/gi, '_') || 'app'}.html`;

      if (navigator.share && navigator.canShare) {
        try {
          const file = new File([codeToExport], safeFilename, { type: 'text/html' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: targetApp.name
            });
            showToast("Exported successfully!");
            return;
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Browser Fallback: Blob Download
      try {
        const blob = new Blob([codeToExport], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = safeFilename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`Saved "${safeFilename}"!`);
      } catch (e) {
        showToast("Failed to export HTML.");
      }
    }

    // =========================================================================
    // EXPORT / BACKUP & RESTORE
    // =========================================================================
    async function exportAllApps() {
      if (!apps || apps.length === 0) {
        showToast("No apps to export!");
        return;
      }

      const dateIso = new Date().toISOString().split('T')[0];
      const filename = `weblauncher-backup-${dateIso}.json`;
      
      const backupData = {
        version: 2,
        source: "WebLauncher",
        exportedAt: new Date().toISOString(),
        totalApps: apps.length,
        apps: apps
      };

      const jsonStr = JSON.stringify(backupData, null, 2);

      if (navigator.share) {
        try {
          const file = new File([jsonStr], filename, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "WebLauncher Backup" });
            showToast("Backup saved!");
            closeModal('backup-modal');
            return;
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      navigator.clipboard.writeText(jsonStr).then(() => {
        showToast("Backup JSON copied to clipboard!");
      }).catch(() => {
        showToast("Failed to export backup.");
      });
    }

    function triggerBackupRestore() {
      const input = document.getElementById('backup-picker');
      input.value = '';
      input.click();
    }

    function handleBackupSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedApps = Array.isArray(parsed) ? parsed : (parsed.apps || []);

          if (!Array.isArray(importedApps) || importedApps.length === 0) {
            showToast("No valid apps found in backup file.");
            return;
          }

          let restoredCount = 0;
          for (const item of importedApps) {
            if (item && item.name && (item.files || item.code)) {
              const appObj = {
                id: item.id || Date.now() + Math.floor(Math.random() * 1000),
                name: item.name,
                gradient: item.gradient || GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)],
                entry: item.entry || 'index.html',
                files: item.files || { 'index.html': { content: item.code, isBinary: false, type: 'text/html' } },
                code: item.code || (item.files && item.files[item.entry || 'index.html']?.content) || '',
                timestamp: item.timestamp || Date.now()
              };
              await saveAppToDB(appObj);
              restoredCount++;
            }
          }

          await loadApps();
          renderLauncher();
          closeModal('backup-modal');
          showToast(`Restored ${restoredCount} apps!`);
        } catch (err) {
          showToast("Invalid backup JSON file.");
        }
      };
      reader.readAsText(file);
    }

    async function confirmWipeAll() {
      if (confirm("Delete ALL apps? Make sure you exported a backup first.")) {
        await clearAllAppsFromDB();
        await loadApps();
        renderLauncher();
        closeModal('backup-modal');
        showToast("All apps deleted.");
      }
    }

    async function removeApp(event, id) {
      event.stopPropagation();
      await deleteAppFromDB(id);
      await loadApps();
      renderLauncher();
      showToast("App deleted.");
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('edit-toggle-btn');
      btn.innerText = isEditMode ? 'Done' : 'Edit';
      btn.style.background = isEditMode ? '#0A84FF' : 'rgba(255,255,255,0.1)';
      renderLauncher();
    }

    // =========================================================================
    // VIRTUAL BUNDLER & RUNTIME ENGINE
    // =========================================================================
    function cleanupActiveBlobs() {
      if (activeBlobUrls && activeBlobUrls.length > 0) {
        activeBlobUrls.forEach(url => URL.revokeObjectURL(url));
        activeBlobUrls = [];
      }
    }

    function launchApp(app) {
      if (!app || (!app.code && !app.files)) {
        showToast("App files are empty.");
        return;
      }
      currentRunningApp = app;
      recordLog('APP_LAUNCH', `Launching: ${app.name} (ID: ${app.id})`);

      const modal = document.getElementById('runtime-modal');
      collapseFloatingMenu();

      modal.style.display = 'flex';
      assembleAndLoadApp(app);
    }

    function assembleAndLoadApp(app) {
      cleanupActiveBlobs();
      const iframe = document.getElementById('runtime-iframe');
      iframe.removeAttribute('src');

      // Native Capacitor & BLE Bridge Pass-Through
      const bridgeScript = `
        <script id="native-runtime-bridge">
          if (!window.Capacitor && window.parent && window.parent.Capacitor) {
            window.Capacitor = window.parent.Capacitor;
          }
          if (!window.BluetoothLe && window.parent && window.parent.BluetoothLe) {
            window.BluetoothLe = window.parent.BluetoothLe;
          }
        <\/script>
      `;

      const islandShield = `
        <style id="ios-island-shield">
          html, body {
            margin: 0 !important;
            box-sizing: border-box !important;
          }
        </style>
      `;

      // Legacy Single-File Mode
      if (!app.files || Object.keys(app.files).length <= 1) {
        let code = app.code || (app.files && Object.values(app.files)[0]?.content) || '';
        if (code.includes('<head>')) {
          code = code.replace('<head>', '<head>\n' + bridgeScript + '\n' + islandShield);
        } else {
          code = bridgeScript + islandShield + code;
        }
        iframe.srcdoc = code;
        return;
      }

      // Multi-File Virtual Module Resolution
      const blobMap = {};
      const importMap = { imports: {} };

      for (const [relPath, fileObj] of Object.entries(app.files)) {
        let blob;
        if (fileObj.isBinary) {
          const binStr = atob(fileObj.content);
          const bytes = new Uint8Array(binStr.length);
          for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
          blob = new Blob([bytes], { type: fileObj.type });
        } else {
          blob = new Blob([fileObj.content], { type: fileObj.type });
        }

        const bUrl = URL.createObjectURL(blob);
        activeBlobUrls.push(bUrl);
        blobMap[relPath] = bUrl;
        blobMap['./' + relPath] = bUrl;
        blobMap['/' + relPath] = bUrl;

        if (relPath.endsWith('.js') || relPath.endsWith('.mjs')) {
          importMap.imports[relPath] = bUrl;
          importMap.imports['./' + relPath] = bUrl;
        }
      }

      const importMapTag = `<script type="importmap">${JSON.stringify(importMap)}<\/script>`;
      const entryKey = app.entry || 'index.html';
      const entryFile = app.files[entryKey] || Object.values(app.files)[0];
      let html = entryFile.content || '';

      // Inline or map CSS <link rel="stylesheet">
      html = html.replace(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
        const cleanHref = href.replace(/^\.\//, '');
        if (app.files[cleanHref] && !app.files[cleanHref].isBinary) {
          return `<style data-href="${cleanHref}">\n${app.files[cleanHref].content}\n</style>`;
        } else if (blobMap[href]) {
          return `<link rel="stylesheet" href="${blobMap[href]}">`;
        }
        return match;
      });

      // Rewrite Script Sources
      html = html.replace(/<script([^>]+)src=["']([^"']+)["']([^>]*)><\/script>/gi, (match, pre, src, post) => {
        if (blobMap[src]) {
          return `<script${pre}src="${blobMap[src]}"${post}><\/script>`;
        }
        return match;
      });

      // Rewrite Images, Audio and Media
      html = html.replace(/\b(src|href)=["']([^"']+)["']/gi, (match, attr, val) => {
        if (blobMap[val]) {
          return `${attr}="${blobMap[val]}"`;
        }
        return match;
      });

      // Inject Header Assets
      const injections = `\n${importMapTag}\n${bridgeScript}\n${islandShield}\n`;
      if (html.includes('<head>')) {
        html = html.replace('<head>', '<head>' + injections);
      } else {
        html = injections + html;
      }

      iframe.srcdoc = html;
    }

    function exitApp() {
      const modal = document.getElementById('runtime-modal');
      const iframe = document.getElementById('runtime-iframe');
      modal.style.display = 'none';
      iframe.srcdoc = '';
      iframe.src = 'about:blank';
      cleanupActiveBlobs();
      currentRunningApp = null;
      recordLog('APP_EXIT', 'Closed app runtime.');
    }

    function reloadApp() {
      if (currentRunningApp) {
        assembleAndLoadApp(currentRunningApp);
        showToast("App reloaded");
        recordLog('APP_RELOAD', `Reloaded: ${currentRunningApp.name}`);
      }
    }

    // =========================================================================
    // FLOATING CONTROLLER LOGIC (DRAGGABLE & TOUCH-SAFE)
    // =========================================================================
    const floatingContainer = document.getElementById('floating-menu-container');
    const menuPill = document.getElementById('menu-pill');
    const menuExpanded = document.getElementById('menu-expanded');
    const runtimeIframe = document.getElementById('runtime-iframe');

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialLeft = 0;
    let initialTop = 0;
    let hasMoved = false;

    floatingContainer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;

      isDragging = true;
      hasMoved = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const rect = floatingContainer.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      floatingContainer.classList.add('is-dragging');
      if (runtimeIframe) runtimeIframe.style.pointerEvents = 'none';
      floatingContainer.setPointerCapture(e.pointerId);
    });

    floatingContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      if (!hasMoved && Math.hypot(dx, dy) > 4) {
        hasMoved = true;
      }

      if (hasMoved) {
        const rect = floatingContainer.getBoundingClientRect();
        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        const margin = 10;
        const maxLeft = window.innerWidth - rect.width - margin;
        const maxTop = window.innerHeight - rect.height - margin;

        newLeft = Math.max(margin, Math.min(newLeft, maxLeft));
        newTop = Math.max(margin, Math.min(newTop, maxTop));

        floatingContainer.style.left = `${newLeft}px`;
        floatingContainer.style.top = `${newTop}px`;
        floatingContainer.style.right = 'auto';
        floatingContainer.style.bottom = 'auto';
      }
    });

    function finishDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      floatingContainer.classList.remove('is-dragging');
      if (runtimeIframe) runtimeIframe.style.pointerEvents = 'auto';

      try { floatingContainer.releasePointerCapture(e.pointerId); } catch (err) {}

      if (!hasMoved) {
        toggleFloatingMenu();
      }
    }

    floatingContainer.addEventListener('pointerup', finishDrag);
    floatingContainer.addEventListener('pointercancel', finishDrag);

    function toggleFloatingMenu() {
      if (menuExpanded.style.display === 'none' || menuExpanded.style.display === '') {
        menuPill.style.display = 'none';
        menuExpanded.style.display = 'flex';

        requestAnimationFrame(() => {
          const rect = floatingContainer.getBoundingClientRect();
          if (rect.right > window.innerWidth - 10) {
            const shift = rect.right - (window.innerWidth - 10);
            floatingContainer.style.left = `${Math.max(10, rect.left - shift)}px`;
          }
          if (rect.bottom > window.innerHeight - 10) {
            const shift = rect.bottom - (window.innerHeight - 10);
            floatingContainer.style.top = `${Math.max(10, rect.top - shift)}px`;
          }
        });
      } else {
        collapseFloatingMenu();
      }
    }

    function collapseFloatingMenu() {
      menuExpanded.style.display = 'none';
      menuPill.style.display = 'flex';
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2400);
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      await loadApps();
      renderLauncher();
    });
  </script>
</body>
</html>
