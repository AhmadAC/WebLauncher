name: "Build iOS IPA"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Prepare package.json and web assets
      - name: Setup Web Directory & Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          # Install Capacitor 6, Bluetooth LE, and Capacitor 6-compatible Text-to-Speech (v5.x)
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/ios@^6.0.0 @capacitor-community/bluetooth-le@^6.0.0 @capacitor-community/text-to-speech@^5.1.0

          # Create www directory and copy web files cleanly
          mkdir -p www

          # Support both Index.html and index.html naming
          if [ -f Index.html ]; then
            cp -f Index.html www/index.html
          elif [ -f index.html ]; then
            cp -f index.html www/index.html
          fi

          # Copy any companion modules, assets, and styles into web root
          cp -r *.css *.js assets modules www/ 2>/dev/null || true

      # Step 4: Configure Capacitor, Deployment Target, and Native SMB (SPM)
      - name: Configure Capacitor iOS Platform
        run: |
          # Remove any previous conflicting build artifacts
          rm -rf ios capacitor.config.json capacitor.config.ts

          # Initialize capacitor with full bridge access
          npx cap init "WebLauncher" "com.ahmadac.weblauncher" --web-dir "www"

          # Add iOS platform files
          npx cap add ios

          # Inject mandatory iOS Bluetooth, Camera, Local Wi-Fi Network, and ATS Entitlements
          if [ -f ios/App/App/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'WebLauncher connects to and controls ESP32 and BLE peripherals.'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription 'WebLauncher connects to and controls ESP32 and BLE peripherals.'" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'WebLauncher communicates with nearby ESP32 devices.'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription 'WebLauncher communicates with nearby ESP32 devices.'" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'WebLauncher discovers and communicates with companion apps and SMB shares on your local Wi-Fi network.'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'WebLauncher discovers and communicates with companion apps and SMB shares on your local Wi-Fi network.'" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'WebLauncher uses the camera when launched apps scan QR codes.'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'WebLauncher uses the camera when launched apps scan QR codes.'" ios/App/App/Info.plist

            # Bonjour service discovery for local SMB shares
            /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" ios/App/App/Info.plist || true
            /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _smb._tcp" ios/App/App/Info.plist || true

            # Allow plain HTTP / WS connections on local Wi-Fi inside WKWebView
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent true" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" ios/App/App/Info.plist

            # Add UIBackgroundModes for bluetooth-central so iOS does not kill the app when connected
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" ios/App/App/Info.plist || true
          fi

          # Force deployment target to iOS 15.0 in Podfile and Xcode Project
          if [ -f ios/App/Podfile ]; then
            sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/g" ios/App/Podfile
          fi
          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          fi

          # Sync capacitor plugins and native code
          npx cap sync ios

          # Wire SmbPlugin.swift + AMSMB2 (Swift Package Manager) into the App target
          # (AMSMB2 3.0+ is distributed via SPM rather than CocoaPods Trunk)
          if [ -f plugins/capacitor-smb/ios/Sources/SmbPlugin/SmbPlugin.swift ]; then
            cp -f plugins/capacitor-smb/ios/Sources/SmbPlugin/SmbPlugin.swift ios/App/App/SmbPlugin.swift

            ruby << 'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          app_target = project.targets.find { |t| t.name == 'App' } || project.targets.first

          app_group = project.main_group.find_subpath('App', true)
          unless app_group.files.any? { |f| f.path == 'SmbPlugin.swift' }
            file_ref = app_group.new_file('SmbPlugin.swift')
            app_target.add_file_references([file_ref])
          end

          pkg_url = 'https://github.com/amosavian/AMSMB2.git'
          pkg_ref = project.root_object.package_references.find { |r| r.respond_to?(:repositoryURL) && r.repositoryURL == pkg_url }
          unless pkg_ref
            pkg_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            pkg_ref.repositoryURL = pkg_url
            pkg_ref.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '4.0.0' }
            project.root_object.package_references << pkg_ref
          end

          unless app_target.package_product_dependencies.any? { |d| d.product_name == 'AMSMB2' }
            pkg_product = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            pkg_product.package = pkg_ref
            pkg_product.product_name = 'AMSMB2'
            app_target.package_product_dependencies << pkg_product

            build_file = project.new(Xcodeproj::Project::Object::PBXBuildFile)
            build_file.product_ref = pkg_product
            app_target.frameworks_build_phase.files << build_file
          end

          project.save
          puts 'Wired SmbPlugin.swift and AMSMB2 Swift Package into App.xcodeproj'
          RUBY

            node -e "const fs=require('fs');const p='ios/App/App/capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.packageClassList=c.packageClassList||[];if(!c.packageClassList.includes('SmbPlugin')){c.packageClassList.push('SmbPlugin');fs.writeFileSync(p,JSON.stringify(c,null,2));console.log('SmbPlugin added to packageClassList')}else{console.log('SmbPlugin registered by cap sync')}"
          fi

          # Run pod install with updated target and resolve Swift packages
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -derivedDataPath build -resolvePackageDependencies
          cd ../..

      # Step 5: Build Xcode Workspace (Unsigned for Sideloading)
      - name: Build Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      # Step 6: Create Payload & Package .ipa
      - name: Package Payload into IPA
        run: |
          mkdir -p build/IPA/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app build/IPA/Payload/
          cd build/IPA
          zip -r WebLauncher.ipa Payload
          echo "IPA successfully created."

      # Step 7: Upload IPA Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebLauncher-IPA
          path: build/IPA/WebLauncher.ipa
          retention-days: 14