name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Prepare package.json and web assets
      - name: Setup Web Directory & Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          # Install stable Capacitor 6 matching the setup from AuthIphone
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/ios@^6.0.0

          # Create www directory and copy index.html into it
          mkdir -p www
          cp index.html www/
          cp -r *.css *.js assets www/ 2>/dev/null || true

      # Step 4: Configure Capacitor & Fix Deployment Target
      - name: Configure Capacitor iOS Platform
        run: |
          # Remove any previous conflicting files
          rm -rf ios capacitor.config.json capacitor.config.ts

          # Initialize capacitor
          npx cap init "WebLauncher" "com.ahmadac.weblauncher" --web-dir "www"

          # Add iOS platform files (ignore initial pod install check if it throws)
          npx cap add ios || true

          # Force deployment target to iOS 15.0 in both Podfile and Xcode Project
          if [ -f ios/App/Podfile ]; then
            sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/g" ios/App/Podfile
          fi
          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          fi

          # Run pod install with updated target
          cd ios/App
          pod install
          cd ../..

          # Sync web code
          npx cap copy ios

      # Step 5: Build Xcode Workspace (Unsigned for Sideloading)
      - name: Build Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      # Step 6: Create Payload & Package .ipa
      - name: Package Payload into IPA
        run: |
          mkdir -p build/IPA/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app build/IPA/Payload/
          cd build/IPA
          zip -r WebLauncher.ipa Payload
          echo "IPA successfully created."

      # Step 7: Upload IPA Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebLauncher-IPA
          path: build/IPA/WebLauncher.ipa
          retention-days: 14
