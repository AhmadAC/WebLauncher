name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Prepare package.json and web assets
      - name: Setup Web Directory & Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          # Install matching Capacitor packages
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          # Create www directory and copy index.html into it
          mkdir -p www
          cp index.html www/
          cp -r *.css *.js assets www/ 2>/dev/null || true

      # Step 4: Initialize and Cleanly Generate Capacitor iOS
      - name: Configure Capacitor iOS Platform
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "WebLauncher" "com.ahmadac.weblauncher" --web-dir "www"
          fi

          # Remove any stale/mismatched existing iOS folder
          rm -rf ios

          # Generate a fresh iOS project and sync web assets
          npx cap add ios
          npx cap copy ios

      # Step 5: Build Xcode Workspace (Unsigned for Ad-Hoc / Sideloading)
      - name: Build Xcode Workspace
        run: |
          cd ios/App
          pod install

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      # Step 6: Create Payload & Package .ipa
      - name: Package Payload into IPA
        run: |
          mkdir -p build/IPA/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app build/IPA/Payload/
          cd build/IPA
          zip -r WebLauncher.ipa Payload
          echo "IPA successfully created."

      # Step 7: Upload IPA Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebLauncher-IPA
          path: build/IPA/WebLauncher.ipa
          retention-days: 14
